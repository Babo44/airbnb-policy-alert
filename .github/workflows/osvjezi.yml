name: Osvjezavanje vijesti

on:
  schedule:
    # Vrijeme je u UTC. 08:00 UTC = 09:00 zimi / 10:00 ljeti po zagrebackom vremenu.
    - cron: "0 8 * * *"
    # 13:00 UTC = 14:00 zimi / 15:00 ljeti.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  osvjezi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic requests exa_py
      - run: python -u osvjezi.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
